name: Materialize production source

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/materialize-production.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Materialize current production transforms
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/revise_funnel_v3.py
          python3 .github/scripts/revise_analytics_v4.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('netlify.toml')
          s=p.read_text(encoding='utf-8')
          old='  command = "python3 .github/scripts/revise_funnel_v3.py && python3 .github/scripts/revise_analytics_v4.py"'
          if old not in s:
              raise SystemExit('expected build transform command not found')
          p.write_text(s.replace(old,'  command = ""',1),encoding='utf-8')
          PY
          grep -q 'No, solo il cambio bolletta' index.html
          grep -q "fetch('/api/track'" index.html
          grep -q 'window.ECON_TRACK=track' index.html
          grep -q 'https://verifica.econ-apex.com/' index.html
          ! grep -q 'Hai un tetto o una copertura disponibile' index.html
          ! grep -q 'Potrei valutarlo' index.html
          git diff --check

      - name: Commit static production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html netlify.toml
          git rm -f .github/scripts/revise_funnel_v3.py .github/scripts/revise_analytics_v4.py .github/workflows/materialize-production.yml
          git diff --cached --check
          git commit -m 'Materialize production landing and remove build transforms'
          git push origin HEAD:main

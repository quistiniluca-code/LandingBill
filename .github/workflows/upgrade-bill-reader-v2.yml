name: Upgrade bill parser v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-bill-reader-v2.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install parser core and regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests
          printf '%s' '' | base64 -d | gzip -d > bill-parser-core.js
          printf '%s' '' | base64 -d | gzip -d > tests/bill-parser-corpus.test.cjs

      - name: Patch browser integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def one(s, old, new, label):
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {n}')
              return s.replace(old,new,1)

          r=Path('bill-reader.js')
          s=r.read_text()
          s=one(s,"const VERSION='bill-reader-1.0.0';","const VERSION='bill-reader-2.0.0';",'reader version')
          s=one(s,"function parseBillText(rawText){\n  const text=flatText(rawText);","function parseBillText(rawText){\n  if(window.EconBillParser&&typeof window.EconBillParser.parseBillText==='function')return window.EconBillParser.parseBillText(rawText);\n  const text=flatText(rawText);",'parser delegation')
          s=one(s,"if(!allowed.includes(f.type)||f.size>7.5*1024*1024)return;\n  handleFile(f);","if(!allowed.includes(f.type)||f.size>20*1024*1024)return;\n  readerPanel.dataset.localOnly=f.size>7.5*1024*1024?'1':'0';\n  handleFile(f);",'reader local file limit')
          s=one(s,"privacy.textContent='Lettura automatica nel browser';","privacy.textContent=readerPanel.dataset.localOnly==='1'?'Lettura locale · file non allegato':'Lettura automatica nel browser';",'reader privacy note')
          r.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=one(s,'PDF, JPG, PNG o WebP · max 7,5 MB','PDF, JPG, PNG o WebP · max 20 MB','upload copy')
          s=one(s,'if(f.size>7.5*1024*1024){clearBillFile();status(\'#energyHelp\',\'File troppo pesante. Massimo 7,5 MB.\');return}','if(f.size>20*1024*1024){clearBillFile();status(\'#energyHelp\',\'File troppo pesante. Massimo 20 MB.\');return}','inline file limit')
          s=one(s,"const f=$('#bill').files[0];if(f)fd.append('bolletta',f,f.name);","const f=$('#bill').files[0];if(f&&f.size<=7.5*1024*1024)fd.append('bolletta',f,f.name);",'Netlify attachment guard')
          s=one(s,'<script src="/bill-reader.js?v=20260909-1"></script>','<script src="/bill-parser-core.js?v=20260910-2"></script>\n<script src="/bill-reader.js?v=20260910-2"></script>','script integration')
          p.write_text(s)
          PY

      - name: Validate parser and integration
        shell: bash
        run: |
          set -euo pipefail
          node --check bill-parser-core.js
          node --check bill-reader.js
          node tests/bill-parser-corpus.test.cjs
          grep -q 'bill-parser-core.js?v=20260910-2' index.html
          grep -q 'f.size>20\*1024\*1024' index.html
          grep -q "f&&f.size<=7.5\*1024\*1024" index.html
          grep -q 'EconBillParser.parseBillText' bill-reader.js

      - name: Commit upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html bill-reader.js bill-parser-core.js tests/bill-parser-corpus.test.cjs
          git diff --cached --check
          git commit -m 'Harden automatic bill parsing with real-bill corpus'
          git push origin HEAD:main

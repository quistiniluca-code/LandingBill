name: Recover missing hero image chunk

on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-hero-chunk.yml']

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hero-savings-57
          fetch-depth: 0
      - name: Recover known blob and rebuild visual
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-hero assets
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/cb119841706d6b7bca5af7e6e7a612151ab1dd7f" \
            | python3 -c "import sys,json,base64; d=json.load(sys.stdin); open('.tmp-hero/part-05','wb').write(base64.b64decode(d['content']))"
          test "$(git hash-object .tmp-hero/part-05)" = "cb119841706d6b7bca5af7e6e7a612151ab1dd7f"
          cat .tmp-hero/part-* | base64 -d > assets/econ-bolletta-prima-dopo-57.png
          echo '07ddf456130700eefe734238ca79973322acb4994e2c056b898698835399e59e  assets/econ-bolletta-prima-dopo-57.png' | sha256sum -c -
      - name: Commit recovered chunk
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp-hero/part-05
          git commit -m 'Recover staged hero image chunk'
          git push origin HEAD:hero-savings-57

name: Update ECON hero copy

on:
  push:
    paths:
      - '.github/workflows/update-hero-copy.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update hero copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('<title>ECON | Sconto in fattura? No in bolletta.</title>', '<title>ECON | Sconto in fattura? Meglio in bolletta.</title>'),
              ('<h1><span class="heroDark">SCONTO<br>IN FATTURA?</span><br><span class="lime">NO IN BOLLETTA.</span></h1>', '<h1><span class="heroDark">SCONTO<br>IN FATTURA?</span><br><span class="lime">MEGLIO IN BOLLETTA.</span></h1>'),
              ('<p class="lead flyerLead"><strong>Compra meno energia</strong> e risparmia con il fornitore.</p>', '<p class="lead flyerLead">Scopri quanto puoi ridurre la tua spesa energetica.</p>'),
              ('>OTTIENI IL RISPARMIO</a>', '>OTTIENI IL TUO RISPARMIO</a>'),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly 1 occurrence, found {count}: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update and remove workflow
        shell: bash
        run: |
          rm .github/workflows/update-hero-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-hero-copy.yml
          git commit -m "Improve ECON hero value proposition"
          git push

name: Install automatic bill reader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-bill-reader.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install and validate automatic bill reader
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > bill-reader.js
          node --check bill-reader.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements=[
            ("$('#spendPanel').classList.remove('hidden');", "$('#spendPanel').classList.toggle('hidden',v!=='manual');"),
            ("status('#energyHelp','File acquisito. Completa almeno uno dei dati sotto.','ok')", "status('#energyHelp','File acquisito. Avvio la lettura automatica...','ok')"),
            ("state.dataQuality=kwh?'USER_DECLARED':'ESTIMATED_FROM_SPEND';", "state.dataQuality=($('#annualKwh').dataset.billParsed==='1'||$('#monthlyBand').dataset.billParsed==='1')?'BILL_PARSED':(kwh?'USER_DECLARED':'ESTIMATED_FROM_SPEND');"),
            ("Per questa preview, anche con bolletta caricata serve almeno una fascia di spesa o il consumo annuo.", "Se la lettura automatica non riesce, compariranno questi campi come fallback.")
          ]
          for old,new in replacements:
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old[:60]}')
              s=s.replace(old,new,1)
          marker='<script src="/bill-reader.js?v=20260909-1"></script>'
          if marker not in s:
              if s.count('</body>')!=1:
                  raise SystemExit('Unexpected </body> count')
              s=s.replace('</body>',marker+'\n</body>',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html bill-reader.js
          git diff --cached --check
          git commit -m 'Add automatic bill reading and OCR'
          git push origin HEAD:main

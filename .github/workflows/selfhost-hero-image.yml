name: Self-host approved hero image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/selfhost-hero-image.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Point hero to local asset
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/econ-bolletta-prima-dopo-57.svg
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'https://drive.google.com/uc?export=view&id=1PiKJvWP8yahrYfxnCJj9ZE-_bUYBiST1&v=20260910-57'
          new = '/assets/econ-bolletta-prima-dopo-57.svg?v=20260911-2'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one old hero URL, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -q '/assets/econ-bolletta-prima-dopo-57.svg?v=20260911-2' index.html
          ! grep -q 'drive.google.com/uc?export=view&id=1PiKJvWP8yahrYfxnCJj9ZE-_bUYBiST1' index.html
          git diff --check

      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f .github/workflows/selfhost-hero-image.yml
          git diff --cached --check
          git commit -m 'Fix hero image loading with local asset'
          git push origin HEAD:main

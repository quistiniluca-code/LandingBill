name: Apply retina hero integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-retina-hero.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch responsive hero
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_css='\n'.join([
            '/* Approved 57% savings hero: full-bleed PNG inside the dedicated box. */',
            '.heroSavingsReady{padding:0!important;overflow:hidden!important;background:#F3FAEC!important}',
            '.heroSavingsReady:before,.heroSavingsReady:after{display:none!important}',
            '.heroSavingsReady .heroSavingsVisual{display:block!important;width:100%!important;height:100%!important;max-width:none!important;object-fit:cover!important;object-position:center!important;border-radius:inherit!important}'
          ])
          new_css='\n'.join([
            '/* Responsive savings hero: native vector artwork, no mobile rasterisation. */',
            '.heroSavingsReady{padding:0!important;overflow:hidden!important;background:#F3FAEC!important;aspect-ratio:4/3!important;height:auto!important;contain:paint}',
            '.heroSavingsReady:before,.heroSavingsReady:after{display:none!important}',
            '.heroSavingsReady .heroSavingsPicture{display:block!important;width:100%!important;height:100%!important}',
            '.heroSavingsReady .heroSavingsVisual{display:block!important;width:100%!important;height:100%!important;max-width:none!important;object-fit:contain!important;object-position:center!important;border-radius:inherit!important;transform:none!important;filter:none!important;image-rendering:auto!important}',
            '@media(max-width:759px){.heroSavingsReady{border-radius:24px!important;box-shadow:0 10px 28px rgba(4,61,0,.08)!important}}',
            '@media(min-width:760px){.heroSavingsReady{aspect-ratio:4/3!important;height:auto!important}}'
          ])
          if s.count(old_css)!=1:
              raise SystemExit(f'hero CSS match count={s.count(old_css)}')
          s=s.replace(old_css,new_css,1)
          old_html='\n'.join([
            '    <aside class="flyerVisual premiumVisual heroSavingsReady" aria-label="Confronto della bolletta prima e dopo il risparmio">',
            '          <img class="heroSavingsVisual" src="/assets/econ-bolletta-prima-dopo-57.svg?v=20260911-2" alt="Confronto della bolletta energia: da 162,35 euro a 69,81 euro, con un risparmio del 57% pari a 92,54 euro." width="720" height="540" decoding="async" fetchpriority="high">',
            '        </aside>'
          ])
          new_html='\n'.join([
            '    <aside class="flyerVisual premiumVisual heroSavingsReady" aria-label="Confronto della bolletta prima e dopo il risparmio">',
            '      <picture class="heroSavingsPicture">',
            '        <source media="(max-width:759px)" srcset="/assets/econ-bolletta-prima-dopo-57-mobile.svg?v=20260912-1" type="image/svg+xml">',
            '        <img class="heroSavingsVisual" src="/assets/econ-bolletta-prima-dopo-57.svg?v=20260912-3" alt="Confronto della bolletta energia: da 162,35 euro a 69,81 euro, con un risparmio del 57% pari a 92,54 euro." width="720" height="540" decoding="async" fetchpriority="high">',
            '      </picture>',
            '    </aside>'
          ])
          if s.count(old_html)!=1:
              raise SystemExit(f'hero HTML match count={s.count(old_html)}')
          s=s.replace(old_html,new_html,1)
          marker='<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">'
          preload='\n'.join([
            marker,
            '<link rel="preload" as="image" href="/assets/econ-bolletta-prima-dopo-57-mobile.svg?v=20260912-1" type="image/svg+xml" media="(max-width:759px)">',
            '<link rel="preload" as="image" href="/assets/econ-bolletta-prima-dopo-57.svg?v=20260912-3" type="image/svg+xml" media="(min-width:760px)">'
          ])
          if s.count(marker)!=1:
              raise SystemExit(f'font marker match count={s.count(marker)}')
          s=s.replace(marker,preload,1)
          p.write_text(s)
          PY
          grep -q 'econ-bolletta-prima-dopo-57-mobile.svg?v=20260912-1' index.html
          grep -q '<picture class="heroSavingsPicture">' index.html
          grep -q 'object-fit:contain!important' index.html
          ! grep -q 'object-fit:cover!important' index.html
          test -s assets/econ-bolletta-prima-dopo-57-mobile.svg
          git diff --check

      - name: Commit responsive quality upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/econ-bolletta-prima-dopo-57-mobile.svg
          git rm -f .github/workflows/apply-retina-hero.yml
          git diff --cached --check
          git commit -m 'Optimize savings hero for retina mobile displays'
          git push origin HEAD:main

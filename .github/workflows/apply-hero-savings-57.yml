name: Apply approved 57 percent savings visual

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hero-savings-57.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace dedicated hero box
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_start = '<aside class="flyerVisual premiumVisual" aria-label="Dalla bolletta alla produzione di energia">'
          new_start = '<aside class="flyerVisual premiumVisual heroSavingsReady" aria-label="Confronto della bolletta prima e dopo il risparmio">'
          if old_start in s:
              start = s.find(old_start)
          elif new_start in s:
              start = s.find(new_start)
          else:
              raise SystemExit('Hero visual start not found')
          end = s.find('</aside>', start)
          if end < 0:
              raise SystemExit('Hero visual end not found')
          end += len('</aside>')
          replacement = '<aside class="flyerVisual premiumVisual heroSavingsReady" aria-label="Confronto della bolletta prima e dopo il risparmio">\n          <img class="heroSavingsVisual" src="https://drive.google.com/uc?export=view&id=1PiKJvWP8yahrYfxnCJj9ZE-_bUYBiST1&v=20260910-57" alt="Confronto della bolletta energia: da 162,35 euro a 69,81 euro, con un risparmio del 57% pari a 92,54 euro." width="720" height="540" decoding="async" fetchpriority="high">\n        </aside>'
          s = s[:start] + replacement + s[end:]
          marker_text = '/* Approved 57% savings hero: full-bleed PNG inside the dedicated box. */'
          if marker_text not in s:
              css = '\n' + marker_text + '\n.heroSavingsReady{padding:0!important;overflow:hidden!important;background:#F3FAEC!important}\n.heroSavingsReady:before,.heroSavingsReady:after{display:none!important}\n.heroSavingsReady .heroSavingsVisual{display:block!important;width:100%!important;height:100%!important;max-width:none!important;object-fit:cover!important;object-position:center!important;border-radius:inherit!important}\n'
              marker = '</style>'
              idx = s.find(marker)
              if idx < 0:
                  raise SystemExit('Style marker not found')
              s = s[:idx] + css + s[idx:]
          p.write_text(s)
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'heroSavingsVisual' index.html
          grep -q '1PiKJvWP8yahrYfxnCJj9ZE-_bUYBiST1' index.html
          grep -q 'risparmio del 57%' index.html
          ! grep -q 'class="billSheet premiumBill"' index.html
          ! grep -q 'class="heroIllustrationHQ"' index.html
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git commit -m 'Use approved full-width 57% savings visual'
          git push origin HEAD:main

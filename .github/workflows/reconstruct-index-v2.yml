name: Reconstruct index v2

on:
  push:
    branches:
      - v2-offline-savings
    paths:
      - '.github/workflows/reconstruct-index-v2.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-offline-savings
          fetch-depth: 0
      - name: Reconstruct and verify index
        shell: bash
        run: |
          set -euo pipefail
          cat .merge-tmp/part00 .merge-tmp/part01 .merge-tmp/part02 .merge-tmp/part03 .merge-tmp/part04 .merge-tmp/part05 .merge-tmp/part06 .merge-tmp/part07 > /tmp/index.b64
          base64 -d /tmp/index.b64 | gzip -d > index.html
          actual="$(git hash-object index.html)"
          expected="914c182801141c6f7b02c08320ab637f0cd10001"
          echo "Expected blob: $expected"
          echo "Actual blob:   $actual"
          test "$actual" = "$expected"
          rm -rf .merge-tmp
          rm -f .github/workflows/reconstruct-index-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html .merge-tmp .github/workflows/reconstruct-index-v2.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update index.html from prepared offline build"
          git push origin HEAD:v2-offline-savings
